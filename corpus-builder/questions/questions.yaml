# Retrieval eval questions.
#
# Fields
#   id        unique, never reuse or renumber (results are tracked per id)
#   question  phrase it the way you'd actually ask it, NOT copied from the paper's wording:
#             copying the paper makes keyword search look better than it is
#   type      lookup        one fact from one passage
#             multihop      needs two passages, where the second depends on the first
#             comparison    needs two passages, compared side by side
#             unanswerable  the answer is not in the corpus (tests that the system says so)
#   tags      free-form; results are broken down per tag. Suggested:
#               equation    the answer IS a formula (tracks parser damage to math)
#               numeric     the answer is a number/value (cutoff radius, error, dataset size)
#               definition  "what is X"
#               plus one tag per seed/topic, e.g. behler-parrinello, nequip, force-fields
#   split     dev (tune on these, look at them freely) or test (only run at the very end)
#   answer    your reference answer, in your own words; used later by the answer eval
#   evidence  where the answer is: the paper's OpenAlex id + a short quote from it
#             - find ids:     grep -i "nequip" corpus/manifest.csv
#             - find quotes:  python evaluate.py search "your keywords"   (copy 10-30 words)
#             - verify:       python evaluate.py check
#             Quotes from equations rarely match (the parser garbles math): quote the
#             sentence just before or after the equation instead.
#   notes     optional, for yourself
#
# Judgments (easiest to add in the app: "Review retrieved passages" on a question):
#   evidence[i].alternatives   other passages that answer that part too, e.g. a later paper
#                              restating the original result. Strict scoring ignores them;
#                              lenient scoring accepts them.
#                                evidence:
#                                  - paper: W...
#                                    quote: "..."
#                                    alternatives:
#                                      - {paper: W..., quote: "..."}
#   not_relevant               passages you reviewed that don't answer the question
#                              (list of {paper, quote}); they're never shown for review again
#
# Aim for: ~40% lookup, ~30% multihop/comparison, ~15% unanswerable, 5-10 tagged equation.
# Write ~20 dev questions first; hold back ~40 more as test once the pipeline is stable.


- id: q011
  question: How does SchNet turn an interatomic distance into the input of its filter network?
  type: lookup
  tags: [equation, schnet]
  split: dev
  answer: >-
    It expands the distance in a basis of Gaussians, e_k = exp(-gamma (|r_j - r_i| - mu_k)^2), with centers mu_k
    on a uniform grid from zero to the distance cutoff. Grid spacing and gamma are both set to 0.1 Angstrom.
    The expansion decorrelates the filter values, which improves the conditioning of the optimization.
  evidence:
    - paper: W2778051509
      quote: "with centers μk chosen on a uniform grid between zero and the distance cutoff. This has the effect of decorrelating the filter values which improves the conditioning of the optimization problem."

- id: q012
  question: Which activation function does SchNet use, and why does that matter for force fields?
  type: lookup
  tags: [equation, schnet]
  split: dev
  answer: >-
    A shifted softplus, ssp(x) = ln(0.5 e^x + 0.5). The shift makes ssp(0) = 0 and improves convergence, and
    because it is infinitely differentiable the learned energy surface is smooth, giving smooth forces and the
    second derivatives needed for training on forces and for vibrational modes.
  evidence:
    - paper: W2778051509
      quote: "The shifting ensures that ssp(0) = 0 and improves the convergence of the network while having infinite order of continuity."

- id: q013
  question: Why can't SchNet use ordinary convolutional layers like image models do?
  type: lookup
  tags: [definition, schnet]
  split: dev
  answer: >-
    Atoms sit at arbitrary positions rather than on a regular grid like pixels, so a fixed filter tensor can't be
    used. SchNet uses continuous-filter convolutions, where a filter-generating network computes the filter
    values from the atoms' relative positions.
  evidence:
    - paper: W2778051509
      quote: "This generalization is necessary since atoms are not located on a regular grid like image pixels, but can be located at arbitrary positions."

- id: q014
  question: What cutoff radius did SchNet use when learning formation energies of bulk crystals?
  type: lookup
  tags: [numeric, schnet]
  split: dev
  answer: >-
    5 Angstrom, on the Materials Project data. Two structures that would contain isolated atoms at that cutoff
    were dropped. (For the small QM9 and MD17 molecules no cutoff was used.)
  evidence:
    - paper: W2778051509
      quote: "We set the distance cutoff rcut = 5Å and discard two examples from the data set that would include isolated atoms with this setting."

- id: q015
  question: How does SchNet make sure its predicted forces conserve energy?
  type: lookup
  tags: [equation, schnet]
  split: dev
  answer: >-
    Forces are not predicted directly: they are the negative gradient of the predicted energy with respect to
    the atomic positions, F_i = -dE/dr_i. With a rotationally invariant energy model this gives rotationally
    equivariant forces and an energy-conserving force field.
  evidence:
    - paper: W2778051509
      quote: "When using a rotationally invariant energy model, this ensures rotationally equivariant force predictions and guarantees an energy conserving force field"

- id: q016
  question: SchNet and NequIP both use continuous convolutions over neighboring atoms. What do their filters see about the neighbors, and how does that change the features they can build?
  type: comparison
  tags: [schnet, nequip]
  split: dev
  answer: >-
    SchNet's filters only see interatomic distances (expanded in Gaussians), so they are rotationally invariant
    and the features stay scalars. NequIP's filters also use the direction to the neighbor, so its internal
    features are geometric tensors that are equivariant to rotation; restricted to scalars it reduces to a
    SchNet-style invariant network.
  evidence:
    - paper: W2778051509
      quote: "It is straightforward to include rotational invariance by computing pairwise distances instead of using relative positions."
    - paper: W4225405705
      quote: "making the network a conventional invariant GNN-IP, involving only invariant convolutions over scalar features in a SchNet-style fashion"

- id: q017
  question: Which kernel method did the SchNet paper compare against on MD17, and how does NequIP do against kernel methods of that kind?
  type: multihop
  tags: [schnet, nequip]
  split: dev
  answer: >-
    SchNet compared against GDML (gradient-domain machine learning), which was more data-efficient on the small
    training set for most molecules. The NequIP paper reports outperforming kernel-based approaches, including
    sGDML (the symmetrized successor of GDML), as well as GAP and FCHL19.
  evidence:
    - paper: W2778051509
      quote: "We also list the performances of gradient domain machine learning (GDML)21 and DTNN28 for reference."
    - paper: W4225405705
      quote: "We find that NequIP significantly outperforms invariant GNN-IPs (such as SchNet [9] and DimeNet [11]), shallow neural networks (such as ANI [40]), and kernel-based approaches"
  notes: Multi-hop on purpose. The second search depends on knowing the first answer (GDML).

- id: q018
  question: Both SchNet and the Behler-Parrinello potential build the prediction from atomic contributions. For which properties does the SchNet paper say this is a poor fit?
  type: comparison
  tags: [schnet, behler-parrinello]
  split: dev
  answer: >-
    Behler-Parrinello writes the total energy as a sum of atomic energies. SchNet does the same for its targets
    and does noticeably worse on the polarizability and the electronic spatial extent <R^2> of QM9 molecules,
    which the authors attribute to that atom-wise decomposition not suiting these properties.
  evidence:
    - paper: W2025444507
      quote: "The main idea is to represent the total energy E of the system as a sum of atomic contributions Ei, an approach that is typically also used in empirical potentials"
    - paper: W2778051509
      quote: "This is most likely due to the decomposition of the energy into atomic contributions which is not appropriate for these properties."

- id: q019
  question: What problem with CHARMM36 was CHARMM36m designed to fix?
  type: lookup
  tags: [force-fields, charmm]
  split: dev
  answer: >-
    CHARMM36 overstabilized compact and left-handed helical structures in intrinsically disordered proteins
    and peptides. CHARMM36m was refined to describe disordered proteins better while keeping the accuracy of
    CHARMM36 for folded proteins.
  evidence:
    - paper: W_CHARMM36M_TODO
  notes: "TODO: answer written from memory; check it against the paper. Find the id with: grep -i charmm36m corpus/manifest.csv, then add a quote."

- id: q020
  question: Which parts of the force field were changed to go from CHARMM36 to CHARMM36m?
  type: lookup
  tags: [force-fields, charmm]
  split: dev
  answer: >-
    Mainly the backbone CMAP correction was refit, to reduce the left-handed helix bias, and the paper recommends
    a modified TIP3P water with a stronger Lennard-Jones interaction on the water hydrogens, so that disordered
    proteins are less overly compact.
  evidence:
    - paper: W_CHARMM36M_TODO
  notes: "TODO: answer written from memory, and the least certain of these. Check it, and correct the answer if the paper says otherwise."

