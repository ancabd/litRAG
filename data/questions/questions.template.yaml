# Retrieval eval questions.
#
# Fields
#   id        unique, never reuse or renumber (results are tracked per id)
#   question  phrase it the way you'd actually ask it, NOT copied from the paper's wording:
#             copying the paper makes keyword search look better than it is
#   type      lookup        one fact from one passage
#             multihop      needs two passages, where the second depends on the first
#             comparison    needs two passages, compared side by side
#             unanswerable  the answer is not in the corpus (tests that the system says so)
#   tags      free-form; results are broken down per tag. Suggested:
#               equation    the answer IS a formula (tracks parser damage to math)
#               numeric     the answer is a number/value (cutoff radius, error, dataset size)
#               definition  "what is X"
#               plus one tag per seed/topic, e.g. behler-parrinello, nequip, force-fields
#   split     dev (tune on these, look at them freely) or test (only run at the very end)
#   answer    your reference answer, in your own words; the answer eval's judge grades against it
#   evidence  where the answer is: the paper's OpenAlex id + a short quote from it
#             - find ids:     grep -i "nequip" data/corpus/manifest.csv
#             - find quotes:  python evaluate.py search "your keywords"   (copy 10-30 words)
#             - verify:       python evaluate.py check
#             Quotes from equations rarely match (the parser garbles math): quote the
#             sentence just before or after the equation instead.
#   notes     optional, for yourself
#
# Judgments (easiest to add in the app: "Review retrieved passages" on a question):
#   evidence[i].alternatives   other passages that answer that part too, e.g. a later paper
#                              restating the original result. Strict scoring ignores them;
#                              lenient scoring accepts them.
#                                evidence:
#                                  - paper: W...
#                                    quote: "..."
#                                    alternatives:
#                                      - {paper: W..., quote: "..."}
#   not_relevant               passages you reviewed that don't answer the question
#                              (list of {paper, quote}); they're never shown for review again
#
# Aim for: ~40% lookup, ~30% multihop/comparison, ~15% unanswerable, 5-10 tagged equation.
# Write ~20 dev questions first; hold back ~40 more as test once the pipeline is stable.
#
# The examples below have placeholder paper ids and quotes. `evaluate.py check` will
# flag them until you replace both with real ones from your corpus.

