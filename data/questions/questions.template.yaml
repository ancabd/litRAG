- id: q002
  question: What is the functional form of the cutoff function in the original high-dimensional neural network potential?
  type: lookup
  tags: [equation, behler-parrinello]
  split: dev
  answer: "A cosine cutoff: f_c(R) = 0.5 [cos(pi R / R_c) + 1] for R <= R_c, and 0 beyond the cutoff radius R_c."
  evidence:
    - paper: W_BEHLER_PARRINELLO_2007
      quote: "TODO the sentence introducing the cutoff function (not the formula itself)"

- id: q003
  question: How are the total energy and the atomic contributions related in a high-dimensional neural network potential?
  type: lookup
  tags: [equation, definition, behler-parrinello]
  split: dev
  answer: The total energy is a sum of atomic energies, each predicted by an atomic neural network from that atom's local environment within a cutoff.
  evidence:
    - paper: W_BEHLER_PARRINELLO_2007
      quote: "TODO"

- id: q004
  question: Under which symmetry group are NequIP's internal features equivariant, and how are they built?
  type: lookup
  tags: [definition, nequip]
  split: dev
  answer: E(3); features are geometric tensors indexed by irreducible representations of O(3), combined by tensor products with spherical harmonics of relative position vectors.
  evidence:
    - paper: W_NEQUIP_2022
      quote: "TODO"

- id: q005
  question: How does NequIP's handling of rotational symmetry differ from the Behler-Parrinello symmetry functions?
  type: comparison
  tags: [behler-parrinello, nequip]
  split: dev
  answer: Behler-Parrinello uses fixed, hand-designed invariant descriptors (scalars) of the environment; NequIP learns equivariant features that carry vector/tensor information through message passing, and only the final energy is invariant.
  evidence:
    - paper: W_BEHLER_PARRINELLO_2007
      quote: "TODO a passage describing the symmetry functions as invariant descriptors"
    - paper: W_NEQUIP_2022
      quote: "TODO a passage contrasting equivariant with invariant features"

- id: q006
  question: Why have polarizable force fields been developed, according to the force-field review, and what limitation of additive force fields do they address?
  type: lookup
  tags: [force-fields]
  split: dev
  answer: Fixed-charge (additive) force fields cannot respond to their electrostatic environment; polarizable models let the charge distribution change with the environment.
  evidence:
    - paper: W_FORCE_FIELD_REVIEW
      quote: "TODO"

