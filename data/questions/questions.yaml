- id: q032
  question: In DiffTRe, what is the prior potential for, if not a Bayesian prior?
  type: lookup
  tags:
  - definition
  - difftre
  split: dev
  answer: A simple physics-based potential (e.g. a repulsive Lennard-Jones term, or Stillinger-Weber) added to the
    neural network. Early in training it controls which configurations the simulations visit, and therefore where
    the gradient carries information. It also gives a physics-informed starting point, so the network learns a correction
    to the prior. If the data contradicts the prior, the network overrides it.
  evidence:
