    equivariant forces and an energy-conserving force field.'
  evidence:
  - paper: W2778051509
    quote: When using a rotationally invariant energy model, this ensures rotationally equivariant force predictions
      and guarantees an energy conserving force field

- id: q016
  question: SchNet and NequIP both use continuous convolutions over neighboring atoms. What do their filters see
    about the neighbors, and how does that change the features they can build?
  type: comparison
  tags:
  - schnet
  - nequip
  split: dev
  answer: SchNet's filters only see interatomic distances (expanded in Gaussians), so they are rotationally invariant
    and the features stay scalars. NequIP's filters also use the direction to the neighbor, so its internal features
    are geometric tensors that are equivariant to rotation; restricted to scalars it reduces to a SchNet-style invariant
    network.
  evidence:
  - paper: W2778051509
    quote: It is straightforward to include rotational invariance by computing pairwise distances instead of using
      relative positions.
  - paper: W4225405705
    quote: making the network a conventional invariant GNN-IP, involving only invariant convolutions over scalar
      features in a SchNet-style fashion

