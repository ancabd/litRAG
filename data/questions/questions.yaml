- id: q023
  question: What does DiffTRe do differently from backpropagating through an MD simulation, and what does that buy
    it?
  type: lookup
  tags:
  - definition
  - difftre
  split: dev
  answer: It doesn't differentiate through the simulation at all. It combines automatic differentiation with MD
    reweighting, so gradients flow through the reweighted ensemble averages instead of the trajectory. For time-independent
    observables this avoids exploding gradients and makes gradient computation about two orders of magnitude faster,
    with memory needs similar to the adjoint method.
  evidence:
  - paper: W3168247670
    quote: DiffTRe offers end-to-end gradient computation and circumvents the need to differentiate through the
      simulation by combining AD with previous work on MD reweighting schemes

- id: q024
  question: How are the reweighting weights computed in DiffTRe, and why does the kinetic energy drop out?
  type: lookup
  tags:
  - equation
  - difftre
  split: dev
  answer: In the canonical ensemble, each saved state gets w_i = exp(-beta (U_theta(S_i) - U_ref(S_i))), normalized
    over all states. Only the potential energy appears because the kinetic energy is the same under the old and
    new potential and cancels in the Boltzmann ratio. With theta equal to the reference, all weights are 1/N.
  evidence:
  - paper: W3168247670
    quote: Inserting pθ(Si) into Eq. (3) allows computing weights as a function of θ (the kinetic energy cancels)

- id: q025
  question: When does DiffTRe stop reusing the old trajectory and simulate a new one?
  type: lookup
  tags:
  - difftre
  split: dev
  answer: When the effective sample size of the reweighted states, N_eff ~ exp(-sum w_i ln w_i), falls below a chosen
    threshold, meaning a few states dominate the average and its statistical error is too large. A new reference
    trajectory is then run with the current parameters, starting from the last state of the old one.
  evidence:
  - paper: W3168247670
    quote: As soon as Neff < N̄eff, a new reference trajectory needs to be sampled using the current θ as the new
      ˆθ.

