- id: q028
  question: Could you use DiffTRe to fit a potential to a measured diffusion coefficient?
  type: lookup
  tags:
  - difftre
  split: dev
  answer: No. Reweighting treats the trajectory as a set of states and ignores their order in time, so dynamical
    properties such as diffusion coefficients can't be targets; only time-independent observables can.
  evidence:
  - paper: W3168247670
    quote: The reweighting scheme renders DiffTRe invariant to the sequence of states in the trajectory. Hence,
      dynamical properties cannot be employed as target observables.
  notes: Phrased without the paper's wording on purpose (diffusion, not "dynamical properties").

- id: q029
  question: SchNet's C20 force field was trained on DFT data. What do the DiffTRe authors see as the main limitation
    of that kind of training, and what do they train on instead?
  type: comparison
  tags:
  - difftre
  - schnet
  split: dev
  answer: SchNet is trained bottom-up on DFT reference calculations (PBE+vdW-TS for C20). DiffTRe's authors argue
    that bottom-up training is limited by the availability of precise and broad enough quantum data sets, and that
    its accuracy is capped by the reference method. DiffTRe trains top-down instead, so that simulations reproduce
    experimental observables.
  evidence:
  - paper: W2778051509
    quote: By training SchNet on DFT data at the PBE+vdWTS level, we reduce the computation time per single point
      by three orders of magnitude
  - paper: W3168247670
    quote: Thus, the main obstacle in bottom-up learning of NN potentials is currently limited availability of highly
      precise and sufficiently broad data sets.

