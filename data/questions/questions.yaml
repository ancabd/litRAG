  notes: Tempting to answer from memory (Adam, 1e-3); a correct system declines.
  
  
# New questions q046-q058 on ESM-2 / ESMFold (Lin et al., "Evolutionary-scale prediction of atomic
# level protein structure with a language model", W4327550249), to paste at the end of
# questions/questions.yaml after the AlphaFold batch (q034-q045). Renumber if the ids are taken.

- id: q046
  question: What does ESMFold use instead of a multiple sequence alignment, and what does that save at prediction time?
  type: lookup
  tags: [definition, esmfold]
  split: dev
  answer: >-
    The internal representations of the ESM-2 protein language model, computed from the single input sequence.
    No external evolutionary databases, MSAs or templates are needed, which removes the search for related
    sequences (over 10 minutes with AlphaFold's and RosettaFold's high-sensitivity pipelines) and simplifies the
    network.
  evidence:
    - paper: W4327550249
      quote: "This removes costly aspects of current state-of-the-art structure prediction pipelines, eliminating the need for a multiple sequence alignment, while at the same time greatly simplifying the neural architecture used for inference."

- id: q047
  question: What data was ESM-2 trained on, and how many distinct sequences does it see during training?
  type: lookup
  tags: [numeric, esmfold]
  split: dev
  answer: >-
    UniRef sequences, with masked language modelling: sampled evenly across ~43 million UniRef50 clusters drawn
    from ~138 million UniRef90 sequences, so the model sees ~65 million unique sequences over training.
  evidence:
    - paper: W4327550249
      quote: "During training sequences are sampled with even weighting across ∼43 million UniRef50 training clusters from ∼138 million UniRef90 sequences so that over the course of training the model sees ∼65 million unique sequences."

- id: q048
  question: What does perplexity mean for a protein language model, and how much did it improve from the smallest to the largest ESM-2?
  type: lookup
  tags: [numeric, definition, esmfold]
  split: dev
  answer: >-
    Roughly the number of amino acids the model is choosing between at each prediction: 1 for a perfect model, 20
    for random guessing. At 270K training steps the 8M-parameter model has a perplexity of 10.45 and the 15B model
    6.37.
  evidence:
    - paper: W4327550249
      quote: "This fidelity can be measured using perplexity, which ranges from 1 for a perfect model to 20 for a model that makes predictions at random."
    - paper: W4327550249
      quote: "At 270K training steps the 8M parameter model has a perplexity of 10.45, and the 15B model reaches a perplexity of 6.37"

- id: q049
  question: How accurate is ESMFold compared with AlphaFold2 and RoseTTAFold on CAMEO and CASP14?
  type: lookup
  tags: [numeric, esmfold]
  split: dev
  answer: >-
    Average TM-score 0.83 on CAMEO and 0.68 on CASP14, against 0.88 and 0.85 for AlphaFold2 with MSAs and
    templates. RoseTTAFold averages 0.82 on CAMEO, so ESMFold is competitive with it there. With the MSA removed,
    AlphaFold and RoseTTAFold fall well below ESMFold.
  evidence:
    - paper: W4327550249
      quote: "ESMFold achieves an average TM-score of 0.83 on CAMEO and 0.68 on CASP14. Using the search protocols released with AlphaFold2, including MSAs and templates, AlphaFold2 achieves 0.88 and 0.85 on CAMEO and CASP14 respectively."

- id: q050
  question: Which part of ESMFold matters most according to its ablations?
  type: lookup
  tags: [numeric, esmfold]
  split: dev
  answer: >-
    The language model. Against a smaller 8-block baseline at 0.74 LDDT on CAMEO, removing the language model
    drops single-sequence performance to 0.58 LDDT, and removing the folding trunk drops it to 0.66. Other
    ablations (one structure-module block, no recycling, no AlphaFold2 distillation targets, no triangular updates)
    cost only 0.01-0.04 LDDT.
  evidence:
    - paper: W4327550249
      quote: "Without the language model, the single sequence performance on the CAMEO test set degrades substantially, to 0.58 LDDT."

- id: q051
  question: Which ESM-2 model does ESMFold use, and is it fine-tuned along with the folding head?
  type: lookup
  tags: [esmfold]
  split: dev
  answer: >-
    The 3B-parameter ESM-2, the largest that allows inference on a single GPU, and its parameters are frozen
    while ESMFold is trained.
  evidence:
    - paper: W4327550249
      quote: "Language model parameters are frozen for training ESMFold. We use the 3B parameter language model, the largest model that permits inference on a single GPU."

- id: q052
  question: Why does ESM-2 use rotary position embeddings instead of the learned absolute positions of ESM-1b?
  type: lookup
  tags: [definition, esmfold]
  split: dev
  answer: >-
    Absolute position encodings (sinusoidal or learned) don't extrapolate beyond the context window seen in
    training; RoPE lets the model extrapolate. It costs a little extra computation and improved small models, but
    the gains faded as model size and training duration grew.
  evidence:
    - paper: W4327550249
      quote: "In ESM-2, we used Rotary Position Embedding (RoPE) (66) to allow the model extrapolate beyond the context window it is trained on."

- id: q053
  question: How big is the ESM Metagenomic Atlas, and how long did it take to compute?
  type: lookup
  tags: [numeric, esmfold]
  split: dev
  answer: >-
    Over 617 million MGnify90 proteins (all sequences of length 20-1024, 99% of the database), folded in 2 weeks on
    about 2,000 GPUs. About 225 million predictions are high confidence (mean pLDDT > 0.7 and pTM > 0.7) and about
    365 million have good confidence (> 0.5).
  evidence:
    - paper: W4327550249
      quote: "We were able to complete the predictions in 2 weeks on a cluster of approximately 2,000 GPUs"
    - paper: W4327550249
      quote: "∼225 million predictions with high confidence (mean pLDDT > 0.7 and pTM > 0.7)"

- id: q054
  question: How many of the high-confidence metagenomic structures have no similar experimentally determined structure?
  type: lookup
  tags: [numeric, esmfold]
  split: dev
  answer: >-
    In a random sample of 1 million high-confidence structures, 12.6% (125,765) have no PDB structure with TM-score
    over 0.5; at a 0.7 threshold it is 25.4%. 10.4% have both low structural similarity and no close sequence
    homolog.
  evidence:
    - paper: W4327550249
      quote: "For 12.6% of the structures (125,765 proteins), no structure is found with TM-score over 0.5 in the PDB database"

- id: q055
  question: For a 384-residue protein on a V100, how does ESMFold's prediction time compare with AlphaFold's own timings?
  type: comparison
  tags: [numeric, esmfold, alphafold]
  split: dev
  answer: >-
    ESMFold takes 14.2 seconds, which the ESM paper calls 6× faster than a single AlphaFold2 model. The AlphaFold
    paper reports 9.2 minutes with ensembling and 1.1 minutes without, and ESMFold also skips the MSA search, which
    can take over 10 minutes on its own.
  evidence:
    - paper: W4327550249
      quote: "On a single NVIDIA V100 GPU, ESMFold makes a prediction on a protein with 384 residues in 14.2 seconds, 6x faster than a single AlphaFold2 model."
    - paper: W3177828909
      quote: "Without ensembling, the network is 8× faster and the representative timings for a single model are 0.6 min with 256 residues, 1.1 min with 384 residues and 2.1 h with 2,500 residues."
  notes: 1.1 min / 14.2 s is closer to 4.6× than 6×; the papers' numbers come from different setups. A good answer reports both rather than reconciling them.

- id: q056
  question: ESMFold's folding block is adapted from an AlphaFold block. Which one, and what had to change because there is no MSA?
  type: multihop
  tags: [esmfold, alphafold]
  split: dev
  answer: >-
    The Evoformer. AlphaFold's Evoformer keeps a 2D MSA representation (axial attention over its rows and columns)
    and updates the pair representation from it through an outer product summed over the sequences. ESMFold's
    language-model features are one-dimensional, so axial attention becomes standard self-attention over the
    sequence (still biased by the pair representation), sequence and pair communicate through an outer product and
    an outer difference, and templates are replaced by the language model's attention maps.
  evidence:
    - paper: W4327550249
      quote: "Since MSAs are two dimensional, the Evoformer employs axial attention (69) over the columns and rows of the MSA. The language model features are one dimensional, so we can replace the axial attention with a standard attention over this feature space."
    - paper: W3177828909
      quote: "The MSA representation updates the pair representation through an element-wise outer product that is summed over the MSA sequence dimension."

- id: q057
  question: Both AlphaFold and ESMFold add predicted structures to their training data. How does each do it?
  type: comparison
  tags: [esmfold, alphafold]
  split: dev
  answer: >-
    AlphaFold self-distils: its own model predicts ~350,000 Uniclust30 sequences, a high-confidence subset is kept,
    and the final model samples 75% from these predictions and 25% from the PDB. ESMFold distils from AlphaFold2
    instead: ~13.5M AlphaFold2 predictions filtered to mean pLDDT > 70 (removing only 1.5%), no loss on residues
    with pLDDT < 70, also sampled 75% of the time against 25% real structures.
  evidence:
    - paper: W3177828909
      quote: "we use a trained network to predict the structure of around 350,000 diverse sequences from Uniclust3036 and make a new dataset of predicted structures filtered to a high-confidence subset"
    - paper: W4327550249
      quote: "Predicted structures are sampled from 75% of the time, and real structures 25% of the time during training."

