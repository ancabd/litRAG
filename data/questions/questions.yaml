- id: q007
  question: What features does the Nequip architecture use, that are also used by schnet?
  type: comparison
  tags:
  - nequip
  split: dev
  answer: 'Several design choices come from SchNet. The initial atom features are a trainable embedding of the atomic
    number (one-hot encoded). Atoms then pass through a stack of interaction blocks that do continuous convolutions
    over neighbors within a cutoff. In those convolutions the learnable filter weights are an MLP of the interatomic
    distance expanded in a radial basis: Gaussians in SchNet, Bessel functions with an envelope in NequIP. The output
    is per-atom energies summed to a total energy, and forces are its negative gradient. The difference is that
    NequIP also multiplies the radial part by spherical harmonics of the bond direction. If only l = 0 (scalar)
    features are kept, NequIP reduces to a SchNet-style invariant network.'
  evidence:
  - paper: W4225405705
    quote: 'The NequIP network architecture, shown in Figure 2, is built on an atomic embedding, followed by a series
      of interaction blocks, and finally an output block: • Embedding: following SchNet, the initial feature is
      generated using a trainable embedding that operates on the atomic number'
  - paper: W4225405705
    quote: making the network a conventional invariant GNN-IP, involving only invariant convolutions over scalar
      features in a SchNet-style fashion

- id: q008
  question: What does Nequip do as a first step in the architecture?
  type: lookup
  tags:
  - nequip
  split: dev
  answer: It embeds each atom's chemical species. The atomic number Z_i, one-hot encoded, goes through a trainable
    self-interaction (linear) layer. This gives the initial per-atom features, which are scalar (l = 0) only. The
    embedding follows SchNet. Higher-order tensor features first appear in the interaction blocks.
  evidence:
  - paper: W4225405705
    quote: 'Embedding: following SchNet, the initial feature is generated using a trainable embedding that operates
      on the atomic number Zi (represented via a one-hot encoding) alone, implemented via a trainable self-interaction
      layer.'

