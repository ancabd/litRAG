- id: q011
  question: How does SchNet turn an interatomic distance into the input of its filter network?
  type: lookup
  tags:
  - equation
  - schnet
  split: dev
  answer: It expands the distance in a basis of Gaussians, e_k = exp(-gamma (|r_j - r_i| - mu_k)^2), with centers
    mu_k on a uniform grid from zero to the distance cutoff. Grid spacing and gamma are both set to 0.1 Angstrom.
    The expansion decorrelates the filter values, which improves the conditioning of the optimization.
  evidence:
  - paper: W2778051509
    quote: with centers μk chosen on a uniform grid between zero and the distance cutoff. This has the effect of
      decorrelating the filter values which improves the conditioning of the optimization problem.

- id: q012
  question: Which activation function does SchNet use, and why does that matter for force fields?
  type: lookup
  tags:
  - equation
  - schnet
  split: dev
  answer: A shifted softplus, ssp(x) = ln(0.5 e^x + 0.5). The shift makes ssp(0) = 0 and improves convergence, and
    because it is infinitely differentiable the learned energy surface is smooth, giving smooth forces and the second
    derivatives needed for training on forces and for vibrational modes.
  evidence:
  - paper: W2778051509
    quote: The shifting ensures that ssp(0) = 0 and improves the convergence of the network while having infinite
      order of continuity.

- id: q013
  question: Why can't SchNet use ordinary convolutional layers like image models do?
  type: lookup
  tags:
  - definition
  - schnet
  split: dev
  answer: Atoms sit at arbitrary positions rather than on a regular grid like pixels, so a fixed filter tensor can't
    be used. SchNet uses continuous-filter convolutions, where a filter-generating network computes the filter values
    from the atoms' relative positions.
  evidence:
  - paper: W2778051509
    quote: This generalization is necessary since atoms are not located on a regular grid like image pixels, but
      can be located at arbitrary positions.

- id: q014
  question: What cutoff radius did SchNet use when learning formation energies of bulk crystals?
  type: lookup
  tags:
  - numeric
  - schnet
  split: dev
  answer: 5 Angstrom, on the Materials Project data. Two structures that would contain isolated atoms at that cutoff
    were dropped. (For the small QM9 and MD17 molecules no cutoff was used.)
  evidence:
  - paper: W2778051509
    quote: We set the distance cutoff rcut = 5Å and discard two examples from the data set that would include isolated
      atoms with this setting.

- id: q015
  question: How does SchNet make sure its predicted forces conserve energy?
  type: lookup
  tags:
  - equation
  - schnet
  split: dev
  answer: 'Forces are not predicted directly: they are the negative gradient of the predicted energy with respect
    to the atomic positions, F_i = -dE/dr_i. With a rotationally invariant energy model this gives rotationally
    equivariant forces and an energy-conserving force field.'
  evidence:
  - paper: W2778051509
    quote: When using a rotationally invariant energy model, this ensures rotationally equivariant force predictions
      and guarantees an energy conserving force field

- id: q016
  question: SchNet and NequIP both use continuous convolutions over neighboring atoms. What do their filters see
    about the neighbors, and how does that change the features they can build?
  type: comparison
  tags:
  - schnet
  - nequip
  split: dev
  answer: SchNet's filters only see interatomic distances (expanded in Gaussians), so they are rotationally invariant
    and the features stay scalars. NequIP's filters also use the direction to the neighbor, so its internal features
    are geometric tensors that are equivariant to rotation; restricted to scalars it reduces to a SchNet-style invariant
    network.
  evidence:
  - paper: W2778051509
    quote: It is straightforward to include rotational invariance by computing pairwise distances instead of using
      relative positions.
  - paper: W4225405705
    quote: making the network a conventional invariant GNN-IP, involving only invariant convolutions over scalar
      features in a SchNet-style fashion

