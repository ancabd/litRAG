  evidence:
  - paper: W3168247670
    quote: Second, we train the state-of-the-art graph neural network potential DimeNet++ [11, 12] for an atomistic
      model of diamond from its experimental stiffness tensor.
  - paper: W4225405705
    quote: We find that NequIP significantly outperforms invariant GNN-IPs (such as SchNet [9] and DimeNet [11])
  notes: NequIP compares against DimeNet, not DimeNet++; the answer should say so rather than blur the two.

- id: q032
  question: In DiffTRe, what is the prior potential for, if not a Bayesian prior?
  type: lookup
  tags:
  - definition
  - difftre
  split: dev
  answer: A simple physics-based potential (e.g. a repulsive Lennard-Jones term, or Stillinger-Weber) added to the
    neural network. Early in training it controls which configurations the simulations visit, and therefore where
    the gradient carries information. It also gives a physics-informed starting point, so the network learns a correction
    to the prior. If the data contradicts the prior, the network overrides it.
  evidence:
  - paper: W3168247670
    quote: Rather, the prior serves to control the data (trajectory) generation in the beginning of the optimization.

- id: q033
