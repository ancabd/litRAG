  answer: >-
    Median backbone accuracy of 0.96 Å r.m.s.d.95 (Cα r.m.s.d. at 95% residue coverage; 95% CI 0.85-1.16 Å),
    against 2.8 Å for the next best method. For scale, a carbon atom is about 1.4 Å wide.
  evidence:
    - paper: W3177828909
      quote: "AlphaFold structures had a median backbone accuracy of 0.96 Å r.m.s.d.95 (Cα root-mean-square deviation at 95% residue coverage)"

- id: q035
  question: What are the two main stages of the AlphaFold network, and what does each one produce?
  type: lookup
  tags: [definition, alphafold]
  split: dev
  answer: >-
    First a trunk of repeated Evoformer blocks (48) turns the inputs into an Nseq × Nres MSA representation and an
    Nres × Nres pair representation. Then the structure module (8 blocks, shared weights) builds an explicit 3D
    structure as a rotation and translation for each residue, starting from all residues at the origin with
    identity rotations.
  evidence:
    - paper: W3177828909
      quote: "First, the trunk of the network processes the inputs through repeated layers of a novel neural network block that we term Evoformer"
    - paper: W3177828909
      quote: "The trunk of the network is followed by the structure module that introduces an explicit 3D structure in the form of a rotation and translation for each residue of the protein"

- id: q036
  question: Why are AlphaFold's pair-representation updates organised around triangles of residues?
  type: lookup
  tags: [alphafold]
  split: dev
  answer: >-
    For pairwise information to correspond to a single 3D structure it must be consistent, e.g. distances must
    satisfy the triangle inequality. So each update of an edge ij uses the other two edges of triangles ijk: triangle
    self-attention with an extra bias for the missing edge, and the triangle multiplicative update. Either alone
    gives accurate structures, but combining both is more accurate.
  evidence:
    - paper: W3177828909
      quote: "many constraints must be satisfied including the triangle inequality on distances. On the basis of this intuition, we arrange the update operations on the pair representation in terms of triangles of edges involving three different nodes"

- id: q037
  question: Does AlphaFold's structure module keep the peptide bonds intact while it builds the structure? How is the geometry fixed at the end?
  type: lookup
  tags: [alphafold, force-fields]
  split: dev
  answer: >-
    No. Each residue is a free-floating rigid body ("residue gas"), and the network often breaks the chain, which
    lets it refine all parts locally without solving loop closure. A violation loss encourages correct peptide
    geometry during fine-tuning, but it is only enforced exactly by a final relaxation by gradient descent in the
    Amber force field (Amber99sb in OpenMM), which removes stereochemical violations without improving accuracy.
  evidence:
    - paper: W3177828909
      quote: "the peptide bond geometry is completely unconstrained and the network is observed to frequently violate the chain constraint during the application of the structure module"
    - paper: W3177828909
      quote: "Exact enforcement of peptide bond geometry is only achieved in the post-prediction relaxation of the structure by gradient descent in the Amber32 force field."

- id: q038
  question: What loss is AlphaFold mainly trained with, and what does it compare?
  type: lookup
  tags: [definition, alphafold]
  split: dev
  answer: >-
    The frame-aligned point error (FAPE). For each residue's frame, the predicted structure is aligned to the true
    one on that frame and the distances between predicted and true atom positions are computed; the
    Nframes × Natoms distances are penalised with a clamped L1 loss. This makes atoms correct relative to each
    residue's local frame and is the main source of chirality.
  evidence:
    - paper: W3177828909
      quote: "The final loss (which we term the frame-aligned point error (FAPE) (Fig. 3f)) compares the predicted atom positions to the true positions under many different alignments."

- id: q039
  question: How did AlphaFold make use of protein sequences that have no known structure?
  type: lookup
  tags: [alphafold]
  split: dev
  answer: >-
    Self-distillation, similar to noisy student: a trained network predicted structures for about 350,000
    Uniclust30 sequences (355,993 in the Methods), kept a high-confidence subset, and a new model was trained from
    scratch on a mix of PDB data and these predictions (75% predictions, 25% PDB). A BERT-style masked-MSA objective
    also uses unlabelled information, trained jointly rather than pre-trained.
  evidence:
    - paper: W3177828909
      quote: "we use a trained network to predict the structure of around 350,000 diverse sequences from Uniclust3036 and make a new dataset of predicted structures filtered to a high-confidence subset"
  notes: Two numbers in the paper (around 350,000 in the main text, 355,993 in the Methods); accept either.

- id: q040
  question: Below what alignment depth does AlphaFold's accuracy drop off, and what other kind of protein does it struggle with?
  type: lookup
  tags: [numeric, alphafold]
  split: dev
  answer: >-
    Accuracy falls substantially when the median MSA depth is below about 30 sequences; above about 100 the gains
    are small. It is also much weaker for proteins with few intra-chain or homotypic contacts compared with
    heterotypic ones, such as bridging domains whose shape comes from other chains in a complex.
  evidence:
    - paper: W3177828909
      quote: "the accuracy decreases substantially when the median alignment depth is less than around 30 sequences"
    - paper: W3177828909
      quote: "AlphaFold is much weaker for proteins that have few intra-chain or homotypic contacts compared to the number of heterotypic contacts"

- id: q041
  question: How long does a single AlphaFold model take for a 384-residue protein on a V100, with and without ensembling?
  type: lookup
  tags: [numeric, alphafold]
  split: dev
  answer: >-
    9.2 minutes with ensembling (the CASP14 configuration) and 1.1 minutes without; turning ensembling off makes the
    network about 8× faster at very similar accuracy.
  evidence:
    - paper: W3177828909
      quote: "Representative timings for the neural network using a single model on V100 GPU are 4.8 min with 256 residues, 9.2 min with 384 residues and 18 h at 2,500 residues."
    - paper: W3177828909
      quote: "Without ensembling, the network is 8× faster and the representative timings for a single model are 0.6 min with 256 residues, 1.1 min with 384 residues and 2.1 h with 2,500 residues."

- id: q042
  question: Which ablation shows AlphaFold needs metagenomic sequence databases, and how big was the effect?
  type: lookup
  tags: [numeric, alphafold]
  split: dev
  answer: >-
    Re-running CASP14 with different MSA sources: removing BFD cost 0.4 GDT, removing MGnify 0.7 GDT, and removing
    both 6.1 GDT. Most targets barely changed, but a few outliers changed by 20+ GDT; at least one metagenomic
    database matters for targets poorly covered by UniRef.
  evidence:
    - paper: W3177828909
      quote: "Removing BFD reduced the mean accuracy by 0.4 GDT, removing Mgnify reduced the mean accuracy by 0.7 GDT, and removing both reduced the mean accuracy by 6.1 GDT."

- id: q043
  question: AlphaFold's invariant point attention and NequIP both have to deal with rotations of the whole system. Which quantities does each keep invariant, and which equivariant?
  type: comparison
  tags: [alphafold, nequip]
  split: dev
  answer: >-
    In AlphaFold's IPA, query, key and value points are produced in each residue's local frame, so the attention
    output is invariant to global rotations and translations; the frame updates are then applied in each local
    frame, which makes the block as a whole equivariant on the residue gas. NequIP keeps its internal features
    equivariant (geometric tensors under rotation and reflection) throughout message passing, and only its output,
    the potential energy, is invariant.
  evidence:
    - paper: W3177828909
      quote: "The IPA augments each of the usual attention queries, keys and values with 3D points that are produced in the local frame of each residue such that the final value is invariant to global rotations and translations"
    - paper: W4225405705
      quote: "ven though the output of NequIP is the predicted potential energy Epot, which is invariant under translations, reflection, and rotations, the network contains internal features that are geometric tensors which are equivariant to rotation and reflection. This constitutes the core difference between NequIP and existing scalar-valued invariant GNN-IPs."

- id: q044
  question: AlphaFold and DiffTRe both face a shortage of labelled training data. What does each use to get around it?
  type: comparison
  tags: [alphafold, difftre]
  split: dev
  answer: >-
    AlphaFold adds unlabelled sequences through self-distillation: its own high-confidence predicted structures for
    about 350,000 Uniclust30 sequences become extra training data. DiffTRe sees the limit of bottom-up training as
    the lack of precise and broad enough quantum data sets, and instead trains top-down on experimental
    observables through reweighted simulations.
  evidence:
    - paper: W3177828909
      quote: "we use a trained network to predict the structure of around 350,000 diverse sequences from Uniclust3036 and make a new dataset of predicted structures filtered to a high-confidence subset"
    - paper: W3168247670
      quote: "Thus, the main obstacle in bottom-up learning of NN potentials is currently limited availability of highly precise and sufficiently broad data sets."

- id: q045
  question: What learning rate and optimizer were used to train AlphaFold?
  type: unanswerable
  tags: [alphafold]
  split: dev
  answer: >-
    Not answerable from this corpus: the paper only says fine-tuning used a reduced learning rate and refers to
